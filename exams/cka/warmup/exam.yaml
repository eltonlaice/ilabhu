# yaml-language-server: $schema=https://raw.githubusercontent.com/eltonlaice/ilabhu/main/docs/exam-schema.json
schema_version: 1
id: cka/warmup
version: 1
exam: CKA
title: CKA — Warmup
summary: Single-task warmup that exercises the ilabhu pipeline end-to-end. Not the real CKA exam; the full simulation lives at cka/full.
difficulty: easy
estimated_minutes: 10
time_limit_minutes: 30
passing_score: 100

domains:
  - name: Workloads & Scheduling
    weight: 100

infrastructure:
  ttl_minutes: 120
  providers:
    aws:
      module: ./aws
      inputs:
        region: eu-west-1
        instance_type: t3.small
    digitalocean:
      module: ./digitalocean
      inputs:
        region: ams3
        droplet_size: s-1vcpu-2gb
    gcp:
      module: ./gcp
      inputs:
        region: europe-west1
        zone: europe-west1-b
        machine_type: e2-small
    # azure, byo-hosts will be added in follow-up PRs.

access:
  kind: kubeconfig
  output: kubeconfig

instructions: |
  A single-node Kubernetes cluster (k3s) is ready for you.

  This is a warmup, not the full CKA exam. It exists to verify the
  end-to-end pipeline (provision, fetch kubeconfig, validate, destroy).

tasks:
  - id: create-pod
    title: Create the Pod
    domain: Workloads & Scheduling
    weight: 100
    instructions: |
      Create a Pod with the following spec:

      - **Name**: `nginx-limited`
      - **Namespace**: `default`
      - **Image**: `nginx:1.25`
      - **CPU limit**: `200m`
      - **Memory limit**: `256Mi`

      The Pod must reach the `Running` phase.
    validations:
      - kind: kubectl
        args: ["get", "pod", "nginx-limited", "-n", "default", "-o", "jsonpath={.status.phase}"]
        expect_equals: "Running"
      - kind: kubectl
        args: ["get", "pod", "nginx-limited", "-n", "default", "-o", "jsonpath={.spec.containers[0].resources.limits.cpu}"]
        expect_equals: "200m"
      - kind: kubectl
        args: ["get", "pod", "nginx-limited", "-n", "default", "-o", "jsonpath={.spec.containers[0].resources.limits.memory}"]
        expect_equals: "256Mi"
      - kind: kubectl
        args: ["get", "pod", "nginx-limited", "-n", "default", "-o", "jsonpath={.spec.containers[0].image}"]
        expect_equals: "nginx:1.25"
