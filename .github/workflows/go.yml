name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt actions into the Node.js 24 runtime ahead of the June 2026 cutover, so
# we surface any incompatibilities now rather than on the forced switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build, vet, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: control-plane/go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage)
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate
        env:
          MIN_COVERAGE: "45.0"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total coverage: ${total}%"
          go tool cover -func=coverage.out | tail -20
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }' || {
            echo "::error::Coverage ${total}% is below the ${MIN_COVERAGE}% threshold."
            exit 1
          }

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: control-plane/coverage.out
          retention-days: 14
