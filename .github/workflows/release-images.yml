name: Release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Required when dispatched manually."
        required: true
        type: string

# Opt actions into the Node.js 24 runtime ahead of the June 2026 cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build & push ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ilabhud
            context: ./control-plane
            dockerfile: ./control-plane/Dockerfile
          - name: ilabhu-web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # Conditional: enabled when the operator sets a DOCKERHUB_USERNAME
        # repo variable. Without it the workflow still publishes to GHCR.
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # One target per registry. metadata-action handles blank lines, so
          # an empty docker.io entry (when DOCKERHUB_USERNAME isn't set)
          # collapses cleanly and only GHCR is targeted.
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/{1}', vars.DOCKERHUB_USERNAME, matrix.image.name) || '' }}
          # The tag the workflow is firing for (either pushed or dispatched);
          # 'latest' only on a real semver tag (not pre-release / dispatched
          # one-off).
          tags: |
            type=raw,value=${{ steps.ref.outputs.ref }}
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.ref }}
            type=raw,value=latest,enable=${{ !contains(steps.ref.outputs.ref, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=ilabhu — open-source certification exam simulator
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://ilabhu.com/
            org.opencontainers.image.version=${{ steps.ref.outputs.ref }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Attest provenance (GHCR)
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest provenance (Docker Hub)
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sync Docker Hub README
        # Pushes the GitHub README to the corresponding Docker Hub repo so the
        # listing page isn't blank. Only the first image in the matrix needs
        # the full repo README; the other matches a small per-image blurb.
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
          short-description: "ilabhu — ${{ matrix.image.name }} (open-source certification exam simulator). See https://github.com/${{ github.repository }}."
          readme-filepath: ./README.md
          enable-url-completion: true
